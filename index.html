<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harinaam Registration</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body { font-family: Georgia; padding:20px; }

input, textarea, select {
  width:100%;
  padding:10px;
  margin:8px 0;
}

button {
  width:100%;
  padding:12px;
  background:gold;
}
</style>
</head>

<body>

<h2>Harinaam Registration</h2>

<form id="form">

<input type="text" id="name" placeholder="Name" required>
<input type="tel" id="phone" placeholder="Phone" required>
<textarea id="address" placeholder="Address"></textarea>

<input type="text" id="date" placeholder="Select Date">

<select id="slot">
<option>6 PM - 8 PM</option>
</select>

<input type="number" id="count" placeholder="Participants">

<textarea id="notes" placeholder="Notes"></textarea>

<button>Submit</button>

</form>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbz1nx5hqI7jsSjnszcP8hu38YL2Z4YxHcgJ1V-kkC-VBo7JxpoxUA1Y_Njs9dhO5J2fEQ/exec";

fetch(scriptURL)
.then(res => res.json())
.then(dates => {
  flatpickr("#date", {
    dateFormat: "Y-m-d",
    disable: dates
  });
});

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const data = {
    name: name.value,
    phone: phone.value,
    address: address.value,
    date: date.value,
    slot: slot.value,
    count: count.value,
    notes: notes.value
  };

  await fetch(scriptURL, {
    method: "POST",
    body: JSON.stringify(data)
  });

  alert("Submitted!");
});

</script>

</body>
</html>
