<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harinaam Registration</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body { font-family: Georgia; padding:20px; }

input, textarea, select {
  width:100%;
  padding:10px;
  margin:8px 0;
}

button {
  width:100%;
  padding:12px;
  background:gold;
}
</style>
</head>

<body>

<h2>Harinaam Registration</h2>

<form id="form">

<input type="text" id="name" placeholder="Name" required>
<input type="tel" id="phone" placeholder="Phone" required>
<textarea id="address" placeholder="Address"></textarea>

<input type="text" id="date" placeholder="Select Date">

<select id="slot">
<option>6 PM - 8 PM</option>
</select>

<input type="number" id="count" placeholder="Participants">

<textarea id="notes" placeholder="Notes"></textarea>

<button>Submit</button>

</form>

<script>

const scriptURL = "https://script.google.com/macros/s/AKfycbxCirKZ5GH5BoslmNJUAwd4y7Be-OrNyE7c8r6vEcI9kIFgRRq_kR75UYbJ5h-h8uyocg/exec";
fetch(scriptURL)
  .then(res => res.json())
  .then(data => {
    flatpickr("#date", {
      dateFormat: "Y-m-d",
      disable: data
    });
  })
  .catch(err => console.error("GET ERROR:", err));
  
fetch(scriptURL)
.then(res => res.json())
.then(dates => {
  flatpickr("#date", {
    dateFormat: "Y-m-d",
    disable: dates
  });
});

document.getElementById("form").addEventListener("submit", async function(e){
  e.preventDefault();

  const payload = {
    name: name.value,
    phone: phone.value,
    address: address.value,
    date: date.value,
    slot: slot.value,
    count: count.value,
    notes: notes.value
  };

  try {
    await fetch(scriptURL, {
      method: "POST",
      mode: "no-cors",   // 🔥 IMPORTANT FIX
      body: JSON.stringify(payload)
    });

    alert("🙏 Submitted successfully!");
  } catch (err) {
    console.error("POST ERROR:", err);
    alert("Submission failed");
  }
});
</script>

</body>
</html>
