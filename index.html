<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Harinaam Registration</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<style>
body { font-family: Georgia; padding:20px; }

input, textarea, select {
  width:100%;
  padding:10px;
  margin:8px 0;
}

button {
  width:100%;
  padding:12px;
  background:gold;
}
</style>
</head>

<body>

<h2>Harinaam Registration</h2>

<form id="form">

<input type="text" id="name" placeholder="Name" required>
<input type="tel" id="phone" placeholder="Phone" required>
<textarea id="address" placeholder="Address"></textarea>

<input type="text" id="date" placeholder="Select Date">

<select id="slot">
<option>6 PM - 8 PM</option>
</select>

<input type="number" id="count" placeholder="Participants">

<textarea id="notes" placeholder="Notes"></textarea>

<button>Submit</button>

</form>


  
<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxCirKZ5GH5BoslmNJUAwd4y7Be-OrNyE7c8r6vEcI9kIFgRRq_kR75UYbJ5h-h8uyocg/exec";
document.getElementById("form").addEventListener("submit", function(e){
  e.preventDefault();

  const btn = document.querySelector("button");

  // 🔥 UX IMPROVEMENT START
  btn.innerText = "Submitting...";
  btn.disabled = true;

  const payload = {
    name: document.getElementById("name").value,
    phone: document.getElementById("phone").value,
    address: document.getElementById("address").value,
    date: document.getElementById("date").value,
    slot: document.getElementById("slot").value,
    count: document.getElementById("count").value,
    notes: document.getElementById("notes").value
  };

  // 🚀 Fire and forget (no waiting)
  fetch(scriptURL, {
    method: "POST",
    mode: "no-cors",
    body: JSON.stringify(payload)
  });

  // ✅ INSTANT SUCCESS MESSAGE
  alert("🙏 Registration Submitted Successfully!");

  // Reset form
  document.getElementById("form").reset();

  // Restore button after 2 sec
  setTimeout(() => {
    btn.innerText = "Submit";
    btn.disabled = false;
  }, 2000);

});
</script>

</body>
</html>
